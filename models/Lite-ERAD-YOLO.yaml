# Lite-EDNet: 轻量版 EDNet（GSConv Slim-Neck）
# License: GPL-3.0 (inherited from YOLOv5)
#
# 本文件定义 Lite-EDNet 模型配置，骨干网络与 EDNet 完全相同，
# 颈部网络将标准 Conv 替换为 GSConv（Slim-Neck），进一步降低计算量与参数量。

# Parameters
nc: 3  # number of classes (drone, bird, plane)
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# EfficientNetLite backbone（骨干网络：与 EDNet 完全相同）
backbone:
  # [from, number, module, args]
  [[-1, 1, stem, [32, 'ReLU6']],             # 0-P1/2  ch_out, act
   [-1, 1, MBConvBlock, [16, 3, 1, 1, 0]],   # 1 ch_out, k_size, s, expand

   [-1, 1, RepVGGBlock, [24, 3, 2]],   # 2-P2/4 ch_out, k_size, s, expand, drop_connect_rate, se
   [-1, 1, SimAM, [24]], # 3
   [-1, 1, MBConvBlock, [24, 3, 1, 6, 0.057]], # 4

   [-1, 1, MBConvBlock, [40, 5, 2, 6, 0.085]],   # 5-P3/8 ch_out, k_size, s, expand, drop_connect_rate, se
   [-1, 1, MBConvBlock, [40, 5, 1, 6, 0.114]], # 6

   [-1, 1, MBConvBlock, [80, 3, 2, 6, 0.142]],   # 7-P4/16 ch_out, k_size, s, expand, drop_connect_rate, se
   [-1, 1, MBConvBlock, [80, 3, 1, 6, 0.171]],
   [-1, 1, MBConvBlock, [80, 3, 1, 6, 0.2]],
   [-1, 1, MBConvBlock, [112, 5, 1, 6, 0.228]],  # 10
   [-1, 1, MBConvBlock, [112, 5, 1, 6, 0.257]],
   [-1, 1, MBConvBlock, [112, 5, 1, 6, 0.285]], # 12

   [-1, 1, MBConvBlock, [192, 5, 2, 6, 0.314]],  # 13-P5/32 ch_out, k_size, s, expand, drop_connect_rate, se
   [-1, 1, MBConvBlock, [192, 5, 1, 6, 0.342]], # 14
   [-1, 1, MBConvBlock, [192, 5, 1, 6, 0.371]], 
   [-1, 1, MBConvBlock, [192, 5, 1, 6, 0.4]],
   [-1, 1, MBConvBlock, [320, 3, 1, 6, 0.428]],  # 17

   [-1, 1, SimAM_ELA, [320]], # 18
   [-1, 1, SPPF, [1024, 5]], # 19
  ]

# YOLOv5 v6.0 head（颈部 + 检测头）
# 颈部将 Conv 替换为 GSConv（Slim-Neck）实现更轻量的特征融合
head:
  [[-1, 1, GSConv, [512, 1, 1]],  # 20
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 21
   [[-1, 12], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3_DWR, [512, False]],  # 23

   [-1, 1, GSConv, [256, 1, 1]], # 24
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 25
   [[-1, 6], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3_DWR, [256, False]],  # 27 (P3/8-small)

   [-1, 1, GSConv, [256, 3, 2]],  # 28
   [[-1, 24], 1, Concat, [1]], # cat head P4
   [-1, 3, C3_DWR, [512, False]],  # 30 (P4/16-medium)

   [-1, 1, GSConv, [512, 3, 2]],  # 31
   [[-1, 20], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3_DWR, [1024, False]],  # 33 (P5/32-large)

   [27, 1, SimAM_ELA, [256]], # 34
   [30, 1, SimAM_ELA, [512]], # 35
   [33, 1, SimAM_ELA, [1024]], # 36

   [[34, 35, 36], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]